# Controlled apply (DEV-06/08): runs only after a PR touching infra/terraform is merged to main,
# re-plans against current state, and applies in the `infra-prod` environment. Only that
# environment can impersonate gha-tf-apply (enforced by the WIF binding in infra/bootstrap).
name: terraform-apply

on:
  push:
    branches: [main]
    paths: ["infra/terraform/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: infra-prod
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_TF_APPLY }}
      - run: terraform init -input=false
      - run: terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan
      - run: terraform apply -input=false -no-color tfplan
