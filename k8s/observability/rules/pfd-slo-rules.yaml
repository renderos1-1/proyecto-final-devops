# GENERATED by scripts/gen-slo-rules.py; edit the script, not this file.
# SLO 1, availability: 99.5% of ingestion requests are not 5xx (7-day window)
# SLO 2, freshness: 99% of processed events finish within 5s of receipt (7-day window)
# Burn-rate alerts use the multi-window pattern (1h + 5m) to fire fast on real incidents and
# clear quickly after mitigation. Definitions: docs/metrics.md
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pfd-slo
  namespace: observability
  labels:
    app.kubernetes.io/part-of: pfd
spec:
  groups:
  - name: pfd-sli.rules
    interval: 30s
    rules:
    - record: pfd:sli_availability:error_ratio_rate5m
      expr: |-
        (
        sum by (namespace) (rate(http_request_duration_seconds_count{route=~"/v1/events.*",status_code=~"5.."}[5m]))
        or
        0 * sum by (namespace) (rate(http_request_duration_seconds_count{route=~"/v1/events.*"}[5m]))
        )
        /
        sum by (namespace) (rate(http_request_duration_seconds_count{route=~"/v1/events.*"}[5m]))
    - record: pfd:sli_freshness:error_ratio_rate5m
      expr: |-
        1 - (
          sum by (namespace) (rate(event_processing_lag_seconds_bucket{le="5.0"}[5m]))
          /
          sum by (namespace) (rate(event_processing_lag_seconds_count[5m]))
        )
    - record: pfd:sli_latency:good_ratio_rate5m
      expr: |-
        sum by (namespace) (rate(http_request_duration_seconds_bucket{route=~"/v1/events.*",le="0.25"}[5m]))
        /
        sum by (namespace) (rate(http_request_duration_seconds_count{route=~"/v1/events.*"}[5m]))
    - record: pfd:sli_availability:error_ratio_rate30m
      expr: |-
        (
        sum by (namespace) (rate(http_request_duration_seconds_count{route=~"/v1/events.*",status_code=~"5.."}[30m]))
        or
        0 * sum by (namespace) (rate(http_request_duration_seconds_count{route=~"/v1/events.*"}[30m]))
        )
        /
        sum by (namespace) (rate(http_request_duration_seconds_count{route=~"/v1/events.*"}[30m]))
    - record: pfd:sli_freshness:error_ratio_rate30m
      expr: |-
        1 - (
          sum by (namespace) (rate(event_processing_lag_seconds_bucket{le="5.0"}[30m]))
          /
          sum by (namespace) (rate(event_processing_lag_seconds_count[30m]))
        )
    - record: pfd:sli_latency:good_ratio_rate30m
      expr: |-
        sum by (namespace) (rate(http_request_duration_seconds_bucket{route=~"/v1/events.*",le="0.25"}[30m]))
        /
        sum by (namespace) (rate(http_request_duration_seconds_count{route=~"/v1/events.*"}[30m]))
    - record: pfd:sli_availability:error_ratio_rate1h
      expr: |-
        (
        sum by (namespace) (rate(http_request_duration_seconds_count{route=~"/v1/events.*",status_code=~"5.."}[1h]))
        or
        0 * sum by (namespace) (rate(http_request_duration_seconds_count{route=~"/v1/events.*"}[1h]))
        )
        /
        sum by (namespace) (rate(http_request_duration_seconds_count{route=~"/v1/events.*"}[1h]))
    - record: pfd:sli_freshness:error_ratio_rate1h
      expr: |-
        1 - (
          sum by (namespace) (rate(event_processing_lag_seconds_bucket{le="5.0"}[1h]))
          /
          sum by (namespace) (rate(event_processing_lag_seconds_count[1h]))
        )
    - record: pfd:sli_latency:good_ratio_rate1h
      expr: |-
        sum by (namespace) (rate(http_request_duration_seconds_bucket{route=~"/v1/events.*",le="0.25"}[1h]))
        /
        sum by (namespace) (rate(http_request_duration_seconds_count{route=~"/v1/events.*"}[1h]))
    - record: pfd:sli_availability:error_ratio_rate6h
      expr: |-
        (
        sum by (namespace) (rate(http_request_duration_seconds_count{route=~"/v1/events.*",status_code=~"5.."}[6h]))
        or
        0 * sum by (namespace) (rate(http_request_duration_seconds_count{route=~"/v1/events.*"}[6h]))
        )
        /
        sum by (namespace) (rate(http_request_duration_seconds_count{route=~"/v1/events.*"}[6h]))
    - record: pfd:sli_freshness:error_ratio_rate6h
      expr: |-
        1 - (
          sum by (namespace) (rate(event_processing_lag_seconds_bucket{le="5.0"}[6h]))
          /
          sum by (namespace) (rate(event_processing_lag_seconds_count[6h]))
        )
    - record: pfd:sli_latency:good_ratio_rate6h
      expr: |-
        sum by (namespace) (rate(http_request_duration_seconds_bucket{route=~"/v1/events.*",le="0.25"}[6h]))
        /
        sum by (namespace) (rate(http_request_duration_seconds_count{route=~"/v1/events.*"}[6h]))
    - record: pfd:sli_availability:error_ratio_rate7d
      expr: |-
        (
        sum by (namespace) (rate(http_request_duration_seconds_count{route=~"/v1/events.*",status_code=~"5.."}[7d]))
        or
        0 * sum by (namespace) (rate(http_request_duration_seconds_count{route=~"/v1/events.*"}[7d]))
        )
        /
        sum by (namespace) (rate(http_request_duration_seconds_count{route=~"/v1/events.*"}[7d]))
    - record: pfd:sli_freshness:error_ratio_rate7d
      expr: |-
        1 - (
          sum by (namespace) (rate(event_processing_lag_seconds_bucket{le="5.0"}[7d]))
          /
          sum by (namespace) (rate(event_processing_lag_seconds_count[7d]))
        )
    - record: pfd:sli_latency:good_ratio_rate7d
      expr: |-
        sum by (namespace) (rate(http_request_duration_seconds_bucket{route=~"/v1/events.*",le="0.25"}[7d]))
        /
        sum by (namespace) (rate(http_request_duration_seconds_count{route=~"/v1/events.*"}[7d]))
    - record: pfd:events_ingested:rate1m
      expr: sum by (namespace, outcome) (rate(events_received_total[1m]))
    - record: pfd:events_processed:rate1m
      expr: sum by (namespace, result) (rate(events_processed_total[1m]))
    - record: pfd:events_backlog:max
      expr: max by (namespace, status) (events_backlog)
    - record: pfd:slo_availability:error_budget_remaining
      expr: 1 - (pfd:sli_availability:error_ratio_rate7d / (1 - 0.995))
    - record: pfd:slo_freshness:error_budget_remaining
      expr: 1 - (pfd:sli_freshness:error_ratio_rate7d / (1 - 0.99))
  - name: pfd-alerts
    rules:
    - alert: PfdIngestAvailabilityBurnRate
      expr: |-
        pfd:sli_availability:error_ratio_rate1h > (14.4 * 0.005)
        and
        pfd:sli_availability:error_ratio_rate5m > (14.4 * 0.005)
      for: 1m
      labels:
        severity: critical
        slo: availability
      annotations:
        summary: Ingestion API returns 5xx fast enough to threaten the availability SLO
        description: '{{ $labels.namespace }}: 1h error ratio {{ $value | humanizePercentage }} burns the 99.5% availability budget at >14.4x
          (1h at this rate = ~8.6% of the 7-day budget).'
        runbook_url: https://github.com/renderos1-1/proyecto-final-devops/blob/main/docs/runbooks/alerts.md
    - alert: PfdFreshnessBurnRate
      expr: |-
        pfd:sli_freshness:error_ratio_rate1h > (14.4 * 0.01)
        and
        pfd:sli_freshness:error_ratio_rate5m > (14.4 * 0.01)
      for: 1m
      labels:
        severity: critical
        slo: freshness
      annotations:
        summary: Events take longer than 5s to be processed, threatening the freshness SLO
        description: '{{ $labels.namespace }}: 1h error ratio {{ $value | humanizePercentage }} burns the 99% freshness (<=5s) budget at >14.4x
          (1h at this rate = ~8.6% of the 7-day budget).'
        runbook_url: https://github.com/renderos1-1/proyecto-final-devops/blob/main/docs/runbooks/alerts.md
    - alert: PfdEventBacklogGrowing
      expr: |-
        pfd:events_backlog:max{status="pending"} > 200
        and
        deriv(pfd:events_backlog:max{status="pending"}[5m]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: 'Pending events keep growing: processing is not keeping up with ingestion'
        description: '{{ $labels.namespace }}: {{ $value }} pending events and still rising for 5m.'
        runbook_url: https://github.com/renderos1-1/proyecto-final-devops/blob/main/docs/runbooks/alerts.md
    - alert: PfdProcessorStalled
      expr: |-
        pfd:events_backlog:max{status="pending"} > 0
        unless on (namespace)
        sum by (namespace) (rate(events_processed_total[5m])) > 0
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: Pending events but nothing processed in the last 5 minutes
        description: '{{ $labels.namespace }}: backlog > 0 and processing rate is 0 (processor down, stuck, or failing every event).'
        runbook_url: https://github.com/renderos1-1/proyecto-final-devops/blob/main/docs/runbooks/alerts.md
