apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingest-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # The F5 controller allows one Ingress per host, so cert-manager adds the ACME challenge
    # path to this Ingress instead of creating a separate solver Ingress (issuance and renewal).
    acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.org/client-max-body-size: "2m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [HOST_PLACEHOLDER]
      secretName: ingest-api-tls
  rules:
    - host: HOST_PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: ingest-api, port: { name: http } }
