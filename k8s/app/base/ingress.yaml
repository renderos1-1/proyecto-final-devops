apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingest-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.org/client-max-body-size: "2m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [HOST_PLACEHOLDER]
      secretName: ingest-api-tls
  rules:
    - host: HOST_PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: ingest-api, port: { name: http } }
