# Applied by the deploy workflow before rolling out the Deployments. Migrations are
# forward-compatible (additive) so the previous app version keeps working after a rollback.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels: { app.kubernetes.io/name: migrate, app.kubernetes.io/part-of: pfd }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: migrate, app.kubernetes.io/part-of: pfd }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets: [{ name: ar-pull }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: ingest-api
          command: [node, dist/migrate.js]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: pfd-secrets, key: DATABASE_URL } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
