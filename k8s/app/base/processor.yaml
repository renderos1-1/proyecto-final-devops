apiVersion: v1
kind: Service
metadata:
  name: processor
  labels: { app.kubernetes.io/name: processor, app.kubernetes.io/part-of: pfd }
spec:
  selector: { app.kubernetes.io/name: processor }
  ports:
    - { name: http, port: 3001, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
  labels: { app.kubernetes.io/name: processor, app.kubernetes.io/part-of: pfd }
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels: { app.kubernetes.io/name: processor }
  template:
    metadata:
      labels: { app.kubernetes.io/name: processor, app.kubernetes.io/part-of: pfd }
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{ name: ar-pull }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 45   # finish the current batch on SIGTERM
      containers:
        - name: processor
          image: processor
          ports:
            - { name: http, containerPort: 3001 }
          envFrom:
            - configMapRef: { name: pfd-config }
          env:
            - { name: PORT, value: "3001" }
            - { name: OTEL_SERVICE_NAME, value: processor }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: pfd-secrets, key: DATABASE_URL } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /healthz/live, port: http }
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: { path: /healthz/ready, port: http }
            periodSeconds: 10
          # liveness fails if the poll loop is stuck > 60s -> kubelet restarts the worker
          livenessProbe:
            httpGet: { path: /healthz/live, port: http }
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 160Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
